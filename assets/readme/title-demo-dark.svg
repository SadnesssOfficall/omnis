<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 92" width="900" height="92" role="img" aria-label="DEMO"><style>@keyframes in{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}@keyframes line{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.in{animation:in 1.2s ease-out both}.ln{transform-box:fill-box;transform-origin:center;animation:line 1.6s .3s ease-out both}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="in"><text x="450" y="46" text-anchor="middle" font-family="'Cormorant Garamond','Cormorant','Didot','Bodoni 72',Georgia,'Times New Roman',serif" font-size="30" letter-spacing="14" fill="#e4ddcc">DEMO</text><text x="450" y="78" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="4" fill="#8f8a7e">REAL OUTPUT, NOTHING STAGED</text></g><rect class="ln" x="250" y="62" width="140" height="1" fill="#f5c27a" opacity=".7"/><rect class="ln" x="510" y="62" width="140" height="1" fill="#f5c27a" opacity=".7"/></svg>